<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Dialed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .success-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .success-content { max-width: 520px; }
  .success-icon {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: rgba(0, 212, 170, 0.1);
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
    animation: fadeInUp 0.6s var(--ease-out-expo) both;
  }
  .success-content h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 2.5rem;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
    animation: fadeInUp 0.6s 0.1s var(--ease-out-expo) both;
  }
  .success-content h1 span { color: var(--accent); }
  .success-content p {
    color: var(--text-secondary);
    font-size: 1.1rem;
    line-height: 1.7;
    margin-bottom: 32px;
    animation: fadeInUp 0.6s 0.2s var(--ease-out-expo) both;
  }
  .success-content .btn-primary {
    animation: fadeInUp 0.6s 0.3s var(--ease-out-expo) both;
  }
</style>
</head>
<body>
<div class="success-page">
  <div class="success-content">
    <div class="success-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>You're <span>Dialed</span> In.</h1>
    <p>Welcome aboard. We'll reach out within 24 hours to learn about your business and start building your system. Check your email for a confirmation and next steps.</p>
    <a href="index.html" class="btn-primary">Back to Home</a>
  </div>
</div>
</body>
</html>
